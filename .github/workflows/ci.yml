name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/ci.yml"
      - "pgwerk/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "pgwerk/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type check
        run: uv run mypy pgwerk/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Build dashboard
        run: pnpm build
        working-directory: dashboard

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

  test:
    needs: [typecheck, build]
    name: Python ${{ matrix.python-version }} / Postgres ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        postgres-version: ["14", "15", "16"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: pgwerk
          POSTGRES_PASSWORD: pgwerk
          POSTGRES_DB: pgwerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Integration tests
        env:
          PGWERK_TEST_DSN: postgresql://pgwerk:pgwerk@localhost/pgwerk_test
        run: uv run pytest tests/integration/ -v --tb=short
